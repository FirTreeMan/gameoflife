<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game of Life</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="canvas"></canvas>

<div id="controls">
  <div id="header">
    <h1>GAME OF LIFE</h1>
    <button id="toggle-btn" title="Collapse/Expand">&#x25B2;</button>
  </div>

  <!-- Playback -->
  <div class="section">
    <div class="section-title">Playback</div>
    <div class="btn-row">
      <button id="step-btn" title="Single step (N)">Step</button>
      <button id="play-btn" title="Play/Pause (Space)">&#x25B6; Play</button>
      <button id="reset-btn" title="Reset (R)">Reset</button>
    </div>
    <div class="slider-row">
      <label>Speed</label>
      <input type="range" id="speed-slider" min="1" max="300" value="10">
      <span class="slider-value"><span id="speed-val">10</span> sps</span>
    </div>
  </div>

  <!-- Rules -->
  <div class="section">
    <div class="section-title-row">
      <div class="section-title">Rules</div>
      <button id="copy-rules-btn" title="Copy current rules to clipboard">Copy</button>
      <button id="random-rules-btn" title="Randomize rules">Random</button>
      <button id="save-rules-btn" title="Save current rules">Save</button>
    </div>
    <div class="rule-toggle-group">
      <label>B:</label>
      <div class="rule-toggles" id="birth-toggles">
        <button class="rule-toggle" data-n="1">1</button>
        <button class="rule-toggle" data-n="2">2</button>
        <button class="rule-toggle active" data-n="3">3</button>
        <button class="rule-toggle" data-n="4">4</button>
        <button class="rule-toggle" data-n="5">5</button>
        <button class="rule-toggle" data-n="6">6</button>
        <button class="rule-toggle" data-n="7">7</button>
        <button class="rule-toggle" data-n="8">8</button>
      </div>
    </div>
    <div class="rule-toggle-group">
      <label>S:</label>
      <div class="rule-toggles" id="survival-toggles">
        <button class="rule-toggle" data-n="1">1</button>
        <button class="rule-toggle active" data-n="2">2</button>
        <button class="rule-toggle active" data-n="3">3</button>
        <button class="rule-toggle" data-n="4">4</button>
        <button class="rule-toggle" data-n="5">5</button>
        <button class="rule-toggle" data-n="6">6</button>
        <button class="rule-toggle" data-n="7">7</button>
        <button class="rule-toggle" data-n="8">8</button>
      </div>
    </div>
    <input type="text" id="rule-input" class="rule-input" placeholder="Enter ruleset...">
    <div id="saved-rules" class="saved-rules"></div>
  </div>

  <!-- Mutation -->
  <div class="section">
    <div class="section-title">Mutation</div>
    <div class="slider-row">
      <label>Rate</label>
      <input type="range" id="mutation-slider" min="0" max="1000" value="0">
      <input type="text" id="mutation-val" class="editable-value" value="0%">
    </div>
  </div>

  <!-- Seed Center -->
  <div class="section">
    <div class="section-title">Seed Center</div>
    <div class="slider-row">
      <label>Rate</label>
      <input type="range" id="seed-slider" min="0" max="1000" value="500">
      <input type="text" id="seed-val" class="editable-value" value="50%">
    </div>
    <div class="slider-row">
      <label>Size</label>
      <input type="range" id="seed-size-slider" min="0" max="1000" value="333">
      <input type="text" id="seed-size-val" class="editable-value" value="33.3%">
    </div>
    <div class="btn-row" style="margin-top:6px">
      <button id="seed-btn" style="flex:1">Seed</button>
    </div>
  </div>

  <!-- Patterns -->
  <div class="section">
    <div class="section-title">Patterns</div>
    <div class="pattern-grid">
    </div>
    <div id="stamp-hint">Click to place &middot; R to rotate &middot; Esc to cancel</div>
  </div>

  <!-- Grid Size -->
  <div class="section">
    <div class="section-title">Grid Size</div>
    <div class="slider-row">
      <input type="range" id="grid-size-slider" min="10" max="5000" value="1000">
      <input type="text" id="grid-size-val" class="editable-value" value="1000">
    </div>
    <div class="btn-row" style="margin-top:6px">
      <button id="grid-size-btn" style="flex:1">Resize</button>
    </div>
  </div>

  <!-- Population graph -->
  <div class="section">
    <div class="section-title">Population</div>
    <canvas id="sparkline" width="232" height="40"></canvas>
  </div>

  <!-- Info -->
  <div class="section">
    <div class="info-grid">
      <span class="info-label">Gen</span>
      <span class="info-value" id="gen-count">0</span>
      <span class="info-label">Pop</span>
      <span class="info-value" id="pop-count">0</span>
      <span class="info-label">Pos</span>
      <span class="info-value" id="cursor-pos">-</span>
      <span class="info-label">Zoom</span>
      <span class="info-value"><span id="zoom-val">10.0</span>x</span>
    </div>
    <div class="zoom-row">
      <button id="zoom-out-btn" title="Zoom out">&minus;</button>
      <div class="zoom-display">Zoom</div>
      <button id="zoom-in-btn" title="Zoom in">+</button>
      <button id="fit-btn" title="Fit to content">Fit</button>
    </div>
  </div>
</div>

<div id="help-hint">Click: draw &middot; Right-drag: pan &middot; Scroll: zoom &middot; Space: play/pause &middot; N: step &middot; R: reset</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
